stages:
  - test

variables:
  # Using Node.js 24 (LTS) for modern feature support and security.
  NODE_VERSION: "24"

# Use the official Node image.
image: node:$NODE_VERSION

# Cache .npm directory to speed up dependency installation across jobs.
cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm/

# Install dependencies before each job.
# 'npm ci' is preferred for CI environments as it is faster and more reliable.
before_script:
  - npm ci --cache .npm --prefer-offline

# Vitest test job
vitest-tests:
  stage: test
  script:
    - npm run test:run
  rules:
    # This ensures the pipeline only runs on Merge Request events.
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
